\* Faithful positive probe: source voting for one block above the boundary is
\* possible BEFORE a validator commits the readiness lock. This invariant is
\* intentionally false and must produce a concrete pre-lock authorization trace.
SPECIFICATION Spec
CONSTANTS
    CorrectVals = {c1, c2, c3}
    ByzVals = {b1}
    Candidates = {betaA, betaB}
    NoCandidate = none
    QSource = 3
    AllowEarlyShare = FALSE
    AllowRestartBypass = FALSE
SYMMETRY Perms
INVARIANT TypeOK
INVARIANT AtomicSlotAndStop
INVARIANT CorrectReadyShareDurable
INVARIANT NoPreparedOrIssuedAfterLock
INVARIANT RestartReloadBeforeUse
INVARIANT UniqueCutCertBody
INVARIANT NoSourceQuorumAfterCutCert
INVARIANT NoSourceVoteBeforeLock
