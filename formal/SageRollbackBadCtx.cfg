\* BROKEN CONTROL (P1-E): a controller that rolls back even when the replay
\* context is missing or hash-mismatched (bypasses the fail-closed gate in
\* rollback.rs validate_replay_context). Expected: ReplayContextFailClosed
\* VIOLATED -- TLC must find a counterexample, proving the gate has teeth.
SPECIFICATION Spec
CONSTANTS
    Hd = 2
    Hc = 4
    Hr = 7
    MaxH = 9
    N = 4
    F = 1
    ManifestIdentity = manifestA
    AllowAbsoluteReversion = FALSE
    AllowBadReplayContext = TRUE
    AllowUncertifiedSeal = FALSE
INVARIANT ReplayContextFailClosed
