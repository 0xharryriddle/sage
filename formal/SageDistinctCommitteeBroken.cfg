\* Target-only gate control: VM has six members, VT has four (overlap two).
\* Three attestations meet NT-FT, so opposite sides of a 3/3 split can
\* each satisfy this threshold within VM and install different blocks.
\* The joint threshold would be max(NM-FM, NT-FT)=5.
SPECIFICATION Spec
CONSTANTS
    NM = 6
    NT = 4
    FM = 1
    FT = 1
    Overlap = 2
    JointGated = FALSE
INVARIANTS
    TypeOK
    Safety
    DecisionUniqueness
